syntax = "proto3";

// Request for real-time data (0xA311, RealResDTO in the S-Miles Installer app)
message RealDataResDTO {
  string ymd_hms = 1;           // local time, "YYYY-MM-DD HH:MM:SS"
  int32 cp = 2;                 // requested page, starting at 0
  int32 err_code = 3;
  int32 offset = 4;             // local time zone offset in seconds
  int32 time = 5;               // epoch
}

// Field numbers follow the single-phase inverter message (SGSMO) of the S-Miles Installer app.
message InverterState {
  int64 inv_id = 1;
  int32 port_id = 2;          // app name: ver. Kept as "port_id" because it keys MQTT/HA entity names
  int32 grid_voltage = 3;     // [V], factor 0.1
  int32 grid_freq = 4;        // [Hz], factor 0.01
  int32 pv_current_power = 5; // [W], factor 0.1
  int32 reactive_power = 6;   // app name: q [var], factor 0.1
  int32 ac_current = 7;       // app name: i [A], factor 0.01
  int32 power_factor = 8;     // app name: pf, factor 0.001
  int32 temperature = 9;      // [C], factor 0.1
  int32 warning_count = 10;   // app name: wnum
  int32 crc = 11;
  int32 link = 12;            // >0: last DTU read of this inverter succeeded; 0: values are stale
  int32 power_limit = 13;     // app name: p_lim [%], factor 0.1
  int32 mi_signal = 14;       // radio signal strength
  int32 coa_s = 15;
  int32 lim_p = 16;           // active power setpoint
  int32 lim_q = 17;           // reactive power setpoint
  int32 limr_pf = 18;         // power factor setpoint
  uint64 route_info = 19;
  int32 bit_field = 20;       // not in the app schema; low byte freezes together with stale data
}

message PortState {
  int64 pv_sn = 1;            // serial number
  int32 pv_port = 2;          // id of the port
  int32 pv_vol = 3;           // [V], factor 0.1
  int32 pv_cur = 4;           // [A], factor 0.01
  int32 pv_power = 5;         // [W], factor 0.1
  int32 pv_energy_total = 6;  // [Wh]
  int32 pv_daily_yield = 7;   // [Wh]
  int32 code = 8;             // per-port status/error code
  int32 e_delta = 9;
}

message HMSStateResponse {
  string dtu_sn = 1;             // serial
  int32 time = 2;               // epoch
  int32 page_count = 3;         // app name: ap; replies with many devices span several pages
  int32 page = 4;               // app name: cp; repeats the requested page
  int32 version = 5;            // app name: ver
  repeated InverterState inverter_state = 9;
  repeated PortState port_state = 11;
  int32 pv_current_power = 12;  // [W], factor 0.1
  int32 pv_daily_yield = 13;    // [Wh]
}