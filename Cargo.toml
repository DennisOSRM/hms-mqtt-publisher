[package]
name = "hms-mqtt-publish"
version = "0.4.0"
edition = "2021"

[workspace]

[dependencies]
anyhow = "1.0.95"
env_logger = "0.11.6"
hms2mqtt = { path = "hms2mqtt" }
log = "0.4.25"
rumqttc = "0.25.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_derive = "1.0.217"
toml = "1.1.6"
rustls-native-certs = "0.8.1"

[package.metadata.cargo-machete]
ignored = ["serde"]