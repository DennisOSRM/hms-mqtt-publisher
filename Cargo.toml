[package]
name = "hms-mqtt-publish"
version = "0.5.1"
edition = "2021"
# Not part of the published binary: changes here don't start a release (release-plz)
exclude = [
    ".devcontainer",
    ".github",
    ".vscode",
    "docs",
    "ha-hoymiles-wifi-addon",
    "ha-hoymiles-wifi-addon-nightly",
    "release-plz.toml",
    "repository.json",
]

[workspace]

[dependencies]
anyhow = "1.0.95"
env_logger = "0.11.6"
hms2mqtt = { path = "hms2mqtt" }
log = "0.4.25"
rumqttc = "0.25.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_derive = "1.0.217"
toml = "1.1.6"
rustls-native-certs = "0.8.1"
ctrlc = { version = "3.5.2", features = ["termination"] }

[package.metadata.cargo-machete]
ignored = ["serde"]
