name: Build multi platform Docker image

# Reusable workflow: builds each platform on a matching runner, then merges the
# per-platform images into one multi-platform image on Docker Hub.
on:
  workflow_call:
    inputs:
      nightly:
        description: Publish as nightly image (per-branch repository, nightly-<date> and latest tags)
        type: boolean
        default: false
      push:
        description: Push to Docker Hub; when false the images are only built
        type: boolean
        default: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          # the arm64 runners cannot execute 32-bit ARM code natively, so arm/v7 is emulated
          - platform: linux/arm/v7
            runner: ubuntu-24.04-arm
            qemu: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "GIT_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ "${{ inputs.nightly }}" = "true" ]; then
            # Docker Hub repository names must be lowercase and cannot contain '/' (e.g. fix/foo)
            ref="${{ github.ref_name }}"
            ref=$(echo "${ref//\//-}" | tr '[:upper:]' '[:lower:]')
            echo "IMAGE=${{ secrets.DOCKER_HUB_NAMESPACE }}/${{ secrets.DOCKER_HUB_REPOSITORY_NIGHTLY }}-${ref}" >> "$GITHUB_ENV"
          else
            echo "IMAGE=${{ secrets.DOCKER_HUB_NAMESPACE }}/${{ secrets.DOCKER_HUB_REPOSITORY }}" >> "$GITHUB_ENV"
          fi

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      - name: Extract metadata (labels) for Docker
        id: meta
        if: inputs.push
        uses: docker/metadata-action@8e671d84a3bd81afdfc4fdbb96a42b07c2a80934
        with:
          images: ${{ env.IMAGE }}

      # pushes the platform image by digest only; the merge job adds the tags
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          build-args: GIT_HASH=${{ env.GIT_HASH }}

      - name: Export digest
        if: inputs.push
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi platform image
    if: inputs.push
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Prepare
        id: prepare
        run: |
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.nightly }}" = "true" ]; then
            ref="${{ github.ref_name }}"
            ref=$(echo "${ref//\//-}" | tr '[:upper:]' '[:lower:]')
            echo "IMAGE=${{ secrets.DOCKER_HUB_NAMESPACE }}/${{ secrets.DOCKER_HUB_REPOSITORY_NIGHTLY }}-${ref}" >> "$GITHUB_ENV"
          else
            echo "IMAGE=${{ secrets.DOCKER_HUB_NAMESPACE }}/${{ secrets.DOCKER_HUB_REPOSITORY }}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      # both metadata steps export DOCKER_METADATA_OUTPUT_* for the steps below
      - name: Extract metadata (nightly tags) for Docker
        if: inputs.nightly
        uses: docker/metadata-action@8e671d84a3bd81afdfc4fdbb96a42b07c2a80934
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=nightly-${{ steps.prepare.outputs.date }}
            type=raw,value=latest

      - name: Extract metadata (release tags) for Docker
        if: ${{ !inputs.nightly }}
        uses: docker/metadata-action@8e671d84a3bd81afdfc4fdbb96a42b07c2a80934
        with:
          images: ${{ env.IMAGE }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # word splitting is intended: one "-t <tag>" per tag and one reference per digest
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:$DOCKER_METADATA_OUTPUT_VERSION"
