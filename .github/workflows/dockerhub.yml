name: Publish multi platform Docker image

on:
  release:
    types: [published]
  # started by the release-plz workflow for the releases it creates
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    uses: ./.github/workflows/docker-image.yml
    with:
      nightly: false
      push: true
    secrets: inherit
