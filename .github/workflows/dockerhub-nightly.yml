name: Publish multi platform nightly Docker image

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push nightly Docker image to Docker Hub
    uses: ./.github/workflows/docker-image.yml
    with:
      nightly: true
      # pull requests only check that the images build; publishing needs the Docker Hub secrets
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
